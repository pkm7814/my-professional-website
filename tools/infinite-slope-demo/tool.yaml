# Calculator definition. The form, the live plots and the tool page are generated from this.
title: "Infinite slope — factor of safety (demo)"
summary: "Live factor of safety for a planar slip parallel to the slope surface, with seepage parallel to the slope."
draft: true                      # true = only built with `python build.py --drafts`
packages: []                     # extra Pyodide packages, e.g. ["numpy"] (slower first load)
disclaimer: "Educational tool. Results are for preliminary assessment only and are not a substitute for a site-specific design."

inputs:
  - { name: c,    label: "Effective cohesion, c′",        unit: "kPa",   default: 5,  min: 0,   max: 100, step: 0.5, slider: true }
  - { name: phi,  label: "Friction angle, φ′",            unit: "°",     default: 30, min: 5,   max: 50,  step: 0.5, slider: true }
  - { name: gamma, label: "Unit weight, γ",               unit: "kN/m³", default: 19, min: 12,  max: 25,  step: 0.1 }
  - { name: z,    label: "Depth of slip plane, z",        unit: "m",     default: 3,  min: 0.2, max: 20,  step: 0.1, slider: true }
  - { name: m,    label: "Water-table ratio, m = h<sub>w</sub>/z", unit: "–", default: 0.5, min: 0, max: 1, step: 0.05, slider: true,
      help: "0 = dry, 1 = water table at the ground surface" }
  - { name: beta, label: "Slope angle, β",                unit: "°",     default: 30, min: 1,   max: 70,  step: 0.5, slider: true }
