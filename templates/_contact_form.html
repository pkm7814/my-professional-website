<div class="contact-form card">
<form id="contact-form" novalidate data-u="{{ site.email_user }}" data-d="{{ site.email_domain }}" data-p1="{{ site.wa_p1 }}" data-p2="{{ site.wa_p2 }}">
  <div class="cf-row">
    <div class="field">
      <label for="cf-name">Name <span class="req" aria-hidden="true">*</span></label>
      <input id="cf-name" name="name" type="text" autocomplete="name" maxlength="100" required>
    </div>
    <div class="field">
      <label for="cf-purpose">Purpose <span class="req" aria-hidden="true">*</span></label>
      <input id="cf-purpose" name="purpose" type="text" maxlength="150" placeholder="e.g. Research collaboration" required>
    </div>
  </div>
  <div class="field">
    <label for="cf-message">Message <span class="req" aria-hidden="true">*</span></label>
    <textarea id="cf-message" name="message" rows="6" maxlength="2000" required></textarea>
    <small class="help"><span id="cf-count">0</span> / 2000 characters</small>
  </div>
  <p class="cf-error" role="alert" hidden></p>
  <div class="cf-actions">
    {% if site.email_user %}<button type="button" class="button primary" data-send="email"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.3L4.5 7H4v.6l8 5.6 8-5.6V7h-.5z"/></svg>Send by e-mail</button>{% endif %}
    {% if site.wa_p1 %}<button type="button" class="button whatsapp" data-send="whatsapp"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>Send on WhatsApp</button>{% endif %}
  </div>
  {% if s.note %}<p class="help cf-note">{{ s.note | mdi }}</p>{% endif %}
</form>
</div>
