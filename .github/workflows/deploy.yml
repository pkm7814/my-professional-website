# Builds and publishes the website to GitHub Pages.
# Runs on every push to main (live in ~1 minute), weekly to refresh ORCID publications,
# and on demand from the Actions tab ("Run workflow").
name: Build and deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh publications from ORCID
        run: python scripts/sync_orcid.py

      - name: Test calculators and site
        run: python -m unittest discover -s tests -v

      - name: Build site (verifies library versions + integrity hashes)
        run: python build.py --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
