# Address of the live site (also decides the URL prefix of every link).
base_url: "https://pkm7814.github.io/my-professional-website"

# Shown in bold in publication author lists.
highlight_author: "Meena, P. K."

# Link to the admin editor (GitHub login required; only accounts with write
# access to the repository can change anything).
admin_url: "https://app.pagescms.org/pkm7814/my-professional-website/main"

# Pinned versions of browser libraries (loaded from cdn.jsdelivr.net with
# integrity hashes). Change a version here, deploy, and CI verifies it exists.
libs:
  plotly: "3.0.1"
  pyodide: "0.27.7"
  katex: "0.16.11"
